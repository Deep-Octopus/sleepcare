name: ${COMPOSE_PROJECT_NAME:-sleep-care}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run ./scripts/init-local-env.sh first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sleep_care}
      MYSQL_USER: ${MYSQL_USER:-sleepcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run ./scripts/init-local-env.sh first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 45s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.10-alpine3.21}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./scripts/init-local-env.sh first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  server:
    image: sleep-care-server:local
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-golang:1.24.13-alpine3.23}
        SERVER_RUNTIME_IMAGE: ${SERVER_RUNTIME_IMAGE:-alpine:3.23}
    environment:
      GIN_MODE: release
      GVA_CONFIG: /app/config/config.yaml
      GVA_REDIS_ADDR: redis:6379
      GVA_REDIS_PASSWORD: ${REDIS_PASSWORD:?run ./scripts/init-local-env.sh first}
      GVA_SYSTEM_USE_REDIS: "true"
      GVA_CARE_SYNTHETIC_FIXTURES_ENABLED: "true"
      GVA_CARE_FIXTURE_PASSWORD: ${GVA_CARE_FIXTURE_PASSWORD:?run ./scripts/init-local-env.sh first}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8888}:8888"
    volumes:
      - server_config:/app/config
      - server_uploads:/app/uploads
      - server_logs:/app/log
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8888/health | grep -q ok
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    image: sleep-care-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-node:22.23.2-alpine3.24}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29.8-alpine3.23}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz | grep -q ok
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  server_config:
  server_uploads:
  server_logs:
