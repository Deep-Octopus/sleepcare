  /care/plan-versions/{id}:
    get:
      tags: [ContentRead]
      operationId: getPlanVersion
      summary: 只读查询计划模板版本
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/PlanVersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    EmployeeToken:
      type: apiKey
      in: header
      name: x-token
      description: GVA 后台员工令牌；不得用于康养用户访问。
    ClientSession:
      type: apiKey
      in: cookie
      name: gva_client_session
      description: 一次性 grant 兑换的 HttpOnly 受限会话。

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 调用方生成并在同一逻辑动作重试时复用的 UUID/ULID。
      schema:
        type: string
        minLength: 16
        maxLength: 128

  responses:
    BadRequest:
      description: 请求体无法解析或字段结构不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 员工令牌或康养用户受限会话无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但角色、组织、责任或敏感范围不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 未预期的基础设施异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RedeemAccessResponse:
      description: 兑换结果；成功时通过 Set-Cookie 写入受限会话
      headers:
        Set-Cookie:
          schema:
            type: string
          description: gva_client_session；生产必须 HttpOnly、Secure、SameSite=Lax。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedeemAccessEnvelope'
    TaskListResponse:
      description: 任务分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskListEnvelope'
    TaskDetailResponse:
      description: 任务详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskDetailEnvelope'
    ClientTaskListResponse:
      description: 客户端受限任务分页；不包含客户或计划内部标识
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientTaskListEnvelope'
    ClientTaskDetailResponse:
      description: 客户端受限任务详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientTaskDetailEnvelope'
    ClientQuestionnaireResponse:
      description: 客户端冻结题目和可空草稿；不包含规则、审核或定义哈希
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientQuestionnaireEnvelope'
    ClientInteractionResponse:
      description: 客户端独立交互事实结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientInteractionEnvelope'
    ClientDraftResponse:
      description: 客户端草稿保存结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientDraftEnvelope'
    ClientSubmitTaskResponse:
      description: 客户端提交结果；不表示已处理
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientSubmitTaskEnvelope'
    QuestionnaireResponse:
      description: 问卷冻结版本
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuestionnaireEnvelope'
    QuestionnaireListResponse:
      description: 问卷版本分页预览
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuestionnaireListEnvelope'
    DraftResponse:
      description: 草稿保存结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DraftEnvelope'
    SubmitTaskResponse:
      description: 提交结果；不表示已处理
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmitTaskEnvelope'
    WorkbenchResponse:
      description: 工作台投影
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkbenchEnvelope'
    CareClientListResponse:
      description: 康养用户分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CareClientListEnvelope'
    CareClientDetailResponse:
      description: 康养用户详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CareClientDetailEnvelope'
    CareClientActionResponse:
      description: 康养用户聚合写操作结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CareClientActionEnvelope'
    CareClientOptionsResponse:
      description: 督导可维护的机构、团队和责任人选项
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CareClientOptionsEnvelope'
    AttentionCaseListResponse:
      description: 关注事项分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttentionCaseListEnvelope'
    AttentionCaseDetailResponse:
      description: 关注事项详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttentionCaseDetailEnvelope'
    DeliveryListResponse:
      description: 通知尝试分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeliveryListEnvelope'
    DailySummaryListResponse:
      description: 每日汇总分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DailySummaryListEnvelope'
    DailySummaryDetailResponse:
      description: 每日汇总详情
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DailySummaryDetailEnvelope'
    ReviewListResponse:
      description: 待复核分页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewListEnvelope'
    PlanVersionResponse:
      description: 计划模板版本
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanVersionEnvelope'
    PlanVersionListResponse:
      description: 计划模板版本分页预览
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanVersionListEnvelope'
    PlanPreviewResponse:
      description: 固定模板版本和锚点计算出的计划预览
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanPreviewEnvelope'
    PlanInstanceResponse:
      description: 幂等启动计划的结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanInstanceEnvelope'
    PlanInstanceListResponse:
      description: 康养用户的计划实例与 D1-D5 时间线
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanInstanceListEnvelope'
    PlanActionResponse:
      description: 计划暂停或恢复结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlanActionEnvelope'
    ActionResponse:
      description: 追加动作结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, data, msg]
      properties:
        code:
          type: integer
          example: 41104
        data:
          nullable: true
        msg:
          type: string
          example: 无权执行该操作

    SuccessFields:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          enum: [0]
        msg:
          type: string
          example: success

    TaskExecutionStatus:
      type: string
      enum: [SCHEDULED, OPEN, IN_PROGRESS, SUBMITTED, CANCELLED]
    TaskTimingStatus:
      type: string
      enum: [NOT_OPEN, WITHIN_WINDOW, OVERDUE, EXPIRED]
    TaskReviewStatus:
      type: string
      enum: [NOT_READY, NOT_REQUIRED, PENDING, REVIEWING, REVIEWED, RETURNED]
    AttentionCaseStatus:
      type: string
      enum:
        - PENDING_ACK
        - ACKNOWLEDGED
        - HANDLING
        - WAITING_CLIENT
        - WAITING_COLLABORATION
        - WAITING_SUPERVISOR
        - RESOLVED
        - CLOSED
    NotificationAttemptStatus:
      type: string
      enum: [PENDING, SUBMITTED_TO_PROVIDER, ACCEPTED, DELIVERED, FAILED, UNKNOWN]
    ContentLifecycleStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, PUBLISHED, DISABLED]
    ContentReviewRecord:
      type: object
      required: [reviewType, reviewedBy, reviewedAt, formalMedicalApproval]
      properties:
        reviewType:
          type: string
          enum: [ENGINEERING, FORMAL]
        reviewedBy:
          oneOf:
            - type: string
            - type: integer
              format: uint64
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        formalMedicalApproval:
          type: boolean
        note:
          type: string

    RedeemAccessRequest:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant:
          type: string
          minLength: 24
          maxLength: 512
          writeOnly: true
    RedeemAccessData:
      type: object
      required: [expiresAt, allowedTaskCount]
      properties:
        expiresAt:
          type: string
          format: date-time
        allowedTaskCount:
          type: integer
          minimum: 0
    RedeemAccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessFields'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/RedeemAccessData'

    AnswerMap:
      type: object
      description: 以冻结问题编码为键；值类型由对应题型决定。
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, answers]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        answers:
          $ref: '#/components/schemas/AnswerMap'
    SubmitTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, source, answers]
      properties:
        expectedTaskVersion:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [CLIENT_SELF]
        clientOccurredAt:
          type: string
          format: date-time
          description: 可选审计元数据；不能替代服务器提交时间。
        answers:
          $ref: '#/components/schemas/AnswerMap'
    RecordTaskInteractionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, interactionType]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        interactionType:
          type: string
          enum: [OPENED, CONSENTED, STARTED]

    CreateCareClientRequest:
      type: object
      additionalProperties: false
      required: [displayCode, displayName, organizationId, synthetic]
      properties:
        displayCode:
          type: string
          maxLength: 64
        displayName:
          type: string
          maxLength: 100
        contactMobile:
          type: string
          maxLength: 32
        organizationId:
          type: integer
          format: uint64
          minimum: 1
        teamId:
          type: integer
          format: uint64
          minimum: 1
          description: P1-02 必须等于康养用户当前团队，跨团队变更需后续独立流程。
          nullable: true
        serviceReason:
          type: string
          maxLength: 500
        servicePackageCode:
          type: string
          maxLength: 64
        synthetic:
          type: boolean
          enum: [true]
    UpdateCareClientRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        displayName:
          type: string
          maxLength: 100
        contactMobile:
          type: string
          maxLength: 32
        teamId:
          type: integer
          format: uint64
          minimum: 1
          nullable: true
        serviceReason:
          type: string
          maxLength: 500
        servicePackageCode:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, roleType, assigneeId, teamId, validFrom, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        roleType:
          type: string
          enum: [CARE_STEWARD, CLINICIAN]
        assigneeId:
          type: integer
          format: uint64
          minimum: 1
        teamId:
          type: integer
          format: uint64
          minimum: 1
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          nullable: true
        replacesAssignmentId:
          type: integer
          format: uint64
          minimum: 1
          nullable: true
          description: 同角色已有生效责任关系时必填，并精确指向被替代关系。
        reason:
          type: string
          maxLength: 1000
    CreateConsentRecordRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, consentType, action, textVersion, occurredAt, source]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        consentType:
          type: string
          enum: [SYNTHETIC_TEST_PARTICIPATION]
        action:
          type: string
          enum: [GRANT, WITHDRAW]
        textVersion:
          type: string
          maxLength: 80
        occurredAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [STAFF_RECORDED]
        reason:
          type: string
          maxLength: 1000

    CareAssignmentSummary:
      type: object
      required: [id, roleType, assigneeId, assigneeDisplayName, teamId, status, validFrom]
      properties:
        id:
          type: integer
          format: uint64
        roleType:
          type: string
          enum: [CARE_STEWARD, CLINICIAN]
        assigneeId:
          type: integer
          format: uint64
        assigneeDisplayName:
          type: string
        teamId:
          type: integer
          format: uint64
        teamName:
          type: string
        status:
          type: string
          enum: [SCHEDULED, ACTIVE, ENDED, CANCELLED]
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          nullable: true
        replacesAssignmentId:
          type: integer
          format: uint64
          nullable: true
        reason:
          type: string
        endReason:
          type: string
    CareClientSummary:
      type: object
      required: [id, displayCode, displayName, organizationId, status, sensitivityLevel, synthetic, version, currentAssignments]
      properties:
        id:
          type: integer
          format: uint64
        displayCode:
          type: string
        displayName:
          type: string
          description: 按当前权限脱敏后的显示名。
        contactMobile:
          type: string
          description: 管家角色仅返回掩码，医护和督导返回授权字段。
        serviceReason:
          type: string
        servicePackageCode:
          type: string
        organizationId:
          type: integer
          format: uint64
        organizationName:
          type: string
        teamId:
          type: integer
          format: uint64
          nullable: true
        teamName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        sensitivityLevel:
          type: string
          enum: [BASIC, SENSITIVE, HIGHLY_SENSITIVE]
        synthetic:
          type: boolean
        version:
          type: integer
          minimum: 1
        currentAssignments:
          type: array
          items:
            $ref: '#/components/schemas/CareAssignmentSummary'
    CareClientDetail:
      allOf:
        - $ref: '#/components/schemas/CareClientSummary'
        - type: object
          required: [assignments, consentStatus, consentRecords]
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/CareAssignmentSummary'
            consentStatus:
              type: string
              enum: [PENDING, GRANTED, WITHDRAWN]
            consentRecords:
              type: array
              items:
                $ref: '#/components/schemas/ConsentRecordSummary'

    ConsentRecordSummary:
      type: object
      required: [id, consentType, action, textVersion, occurredAt, source, recordedBy]
      properties:
        id: {type: integer, format: uint64}
        consentType: {type: string, enum: [SYNTHETIC_TEST_PARTICIPATION]}
        action: {type: string, enum: [GRANT, WITHDRAW]}
        textVersion: {type: string}
        occurredAt: {type: string, format: date-time}
