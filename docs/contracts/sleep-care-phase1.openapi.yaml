          required: [ruleHits, actions]
          properties:
            ruleHits:
              type: array
              items:
                $ref: '#/components/schemas/RuleHitSummary'
            actions:
              type: array
              items:
                $ref: '#/components/schemas/CaseAction'
            handlingResult:
              type: string
              nullable: true
            closeReason:
              type: string
              nullable: true

