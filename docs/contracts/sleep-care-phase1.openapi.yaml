openapi: 3.0.3
info:
  title: Sleep Care Phase 1 Contract
  version: P1-01-v1
  description: >-
    阶段一契约草案。只允许醒目标注的合成夹具；未批准医疗内容、真实通知、
    真实数据和面向康养用户的 AI 均保持禁用。成功与错误均使用 GVA
    {code,data,msg} 响应结构。
servers:
  - url: /api
    description: Web/Nginx 对外入口；后端与 Casbin 路径不含 /api 前缀
tags:
  - name: ClientAccess
  - name: ClientTasks
  - name: Workbench
  - name: CareClients
  - name: StaffTasks
  - name: AttentionCases
  - name: Deliveries
  - name: Supervision
  - name: ContentRead
paths:
  /care/client-access/redeem:
    post:
      tags: [ClientAccess]
      operationId: redeemClientAccess
      summary: 一次性 grant 兑换康养用户受限会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAccessRequest'
      responses:
        '200':
          $ref: '#/components/responses/RedeemAccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks:
    get:
      tags: [ClientTasks]
      operationId: listClientTasks
      summary: 查询当前受限会话允许访问的任务
      description: 不接受 clientId、organizationId 或 assigneeId 扩大范围。
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ClientTaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks/{taskId}:
    get:
      tags: [ClientTasks]
      operationId: getClientTask
      summary: 查询受限会话内的任务详情
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/ClientTaskDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks/{taskId}/questionnaire:
    get:
      tags: [ClientTasks]
      operationId: getClientTaskQuestionnaire
      summary: 获取任务冻结的问卷版本
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/ClientQuestionnaireResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks/{taskId}/interactions:
    post:
      tags: [ClientTasks]
      operationId: recordClientTaskInteraction
      summary: 幂等记录打开、同意或开始交互
      description: 交互事件与通知回执、答卷提交和事项处理相互独立。
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTaskInteractionRequest'
      responses:
        '200':
          $ref: '#/components/responses/ClientInteractionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks/{taskId}/draft:
    put:
      tags: [ClientTasks]
      operationId: saveClientTaskDraft
      summary: 幂等保存任务草稿
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          $ref: '#/components/responses/ClientDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/client/tasks/{taskId}/submit:
    post:
      tags: [ClientTasks]
      operationId: submitClientTask
      summary: 幂等提交任务答卷
      description: 提交成功不等于复核、处置或关闭完成。
      security:
        - ClientSession: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '200':
          $ref: '#/components/responses/ClientSubmitTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /care/workbench:
    get:
      tags: [Workbench]
      operationId: getCareWorkbench
      summary: 查询当前员工责任范围工作台
      security:
        - EmployeeToken: []
      responses:
        '200':
          $ref: '#/components/responses/WorkbenchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients:
    get:
      tags: [CareClients]
      operationId: listCareClients
      summary: 按员工授权范围查询康养用户
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 80
        - name: organizationId
          in: query
          description: 只能缩小服务端授权范围
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          $ref: '#/components/responses/CareClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [CareClients]
      operationId: createCareClient
      summary: 创建康养用户公共资料
      description: 阶段一只允许创建 synthetic=true 的合成用户。
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCareClientRequest'
      responses:
        '200':
          $ref: '#/components/responses/CareClientActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients/{id}:
    get:
      tags: [CareClients]
      operationId: getCareClient
      summary: 查询授权范围内的康养用户详情
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/CareClientDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [CareClients]
      operationId: updateCareClient
      summary: 更新康养用户公共资料
      description: 疑似重复记录不得通过本接口静默合并。
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCareClientRequest'
      responses:
        '200':
          $ref: '#/components/responses/CareClientActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients/{id}/assignments:
    post:
      tags: [CareClients]
      operationId: createCareAssignment
      summary: 追加有有效期的责任关系
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '200':
          $ref: '#/components/responses/CareClientActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients/{id}/consent-records:
    post:
      tags: [CareClients]
      operationId: createConsentRecord
      summary: 追加服务授权或撤回记录
      description: 阶段一合成场景只能记录 SYNTHETIC_TEST_PARTICIPATION，不代表正式授权文本已批准。
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRecordRequest'
      responses:
        '200':
          $ref: '#/components/responses/CareClientActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/client-options:
    get:
      tags: [CareClients]
      operationId: getCareClientOptions
      summary: 获取督导可管理范围内的机构、团队和责任人选项
      description: 仅供 P1-02 最小维护页面使用；普通管家、医护和技术管理员无权读取。
      security:
        - EmployeeToken: []
      responses:
        '200':
          $ref: '#/components/responses/CareClientOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients/{id}/plan-previews:
    post:
      tags: [CareClients]
      operationId: previewCarePlan
      summary: 按固定模板版本和 anchorAt 预览任务
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewPlanRequest'
      responses:
        '200':
          $ref: '#/components/responses/PlanPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/clients/{id}/plan-instances:
    get:
      tags: [CareClients]
      operationId: listCareClientPlans
      summary: 查询责任范围内康养用户的计划与 D1-D5 时间线
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/PlanInstanceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [CareClients]
      operationId: startCarePlan
      summary: 根据已确认预览幂等启动计划
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPlanRequest'
      responses:
        '200':
          $ref: '#/components/responses/PlanInstanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/plan-instances/{id}/pause:
    post:
      tags: [StaffTasks]
      operationId: pauseCarePlan
      summary: 追加原因并暂停计划
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanStateActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/PlanActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/plan-instances/{id}/resume:
    post:
      tags: [StaffTasks]
      operationId: resumeCarePlan
      summary: 追加原因并恢复计划
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanStateActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/PlanActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/tasks:
    get:
      tags: [StaffTasks]
      operationId: listStaffTasks
      summary: 查询员工责任范围任务
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: executionStatus
          in: query
          schema:
            $ref: '#/components/schemas/TaskExecutionStatus'
        - name: timingStatus
          in: query
          schema:
            $ref: '#/components/schemas/TaskTimingStatus'
        - name: careClientId
          in: query
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: planInstanceId
          in: query
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: dayCode
          in: query
          schema:
            type: string
            pattern: '^D[1-5]$'
      responses:
        '200':
          $ref: '#/components/responses/TaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/tasks/{id}:
    get:
      tags: [StaffTasks]
      operationId: getStaffTask
      summary: 查询员工授权范围任务详情
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/TaskDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/tasks/{id}/contact-records:
    post:
      tags: [StaffTasks]
      operationId: createTaskContactRecord
      summary: 追加联系记录
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRecordRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/tasks/{id}/device-records:
    post:
      tags: [StaffTasks]
      operationId: createTaskDeviceRecord
      summary: 追加人工设备观察记录
      description: 只记录来源和观察值，不产生诊断结论。
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRecordRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases:
    get:
      tags: [AttentionCases]
      operationId: listAttentionCases
      summary: 查询授权范围关注事项
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttentionCaseStatus'
        - name: assigneeId
          in: query
          description: 只能缩小服务端授权范围
          schema:
            type: integer
            format: uint64
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/AttentionCaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}:
    get:
      tags: [AttentionCases]
      operationId: getAttentionCase
      summary: 查询授权范围关注事项详情
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/AttentionCaseDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}/acknowledge:
    post:
      tags: [AttentionCases]
      operationId: acknowledgeAttentionCase
      summary: 确认关注事项
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}/handling-records:
    post:
      tags: [AttentionCases]
      operationId: createAttentionHandlingRecord
      summary: 追加关注事项处理记录
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlingRecordRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}/escalate:
    post:
      tags: [AttentionCases]
      operationId: escalateAttentionCase
      summary: 升级关注事项并保留原责任链
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}/close:
    post:
      tags: [AttentionCases]
      operationId: closeAttentionCase
      summary: 在处理结果和关闭理由完整后关闭事项
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCaseRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/attention-cases/{id}/reopen:
    post:
      tags: [AttentionCases]
      operationId: reopenAttentionCase
      summary: 由授权主管重开已关闭事项并保留历史
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenCaseRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /care/deliveries:
    get:
      tags: [Deliveries]
      operationId: listDeliveries
      summary: 查询授权范围通知尝试和回执
      security:
        - EmployeeToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
